<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101e30">
  <title>Knexa AI · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f3ee;color:#152238;font:16px/1.6 Inter,system-ui,sans-serif}
    main{width:min(100%,520px);padding:34px;background:#fff;border:1px solid #e5dfd2;border-radius:22px;box-shadow:0 24px 70px -38px #1b2940;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#101e30;display:grid;place-items:center}
    .mark img{width:48px;height:48px}h1{font-size:26px;margin:0 0 8px}p{color:#5d6878;margin:0 0 22px}button{border:0;border-radius:12px;padding:12px 18px;background:#1c3556;color:white;font:700 14px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/icons/knexa.svg" alt="Knexa AI"></div>
    <h1>You’re offline</h1>
    <p>The Knexa app shell is available, but solving, image processing, practice generation, examinations and account services need an internet connection. Reconnect and try again.</p>
    <a href="/" style="display:inline-block;border-radius:12px;padding:12px 18px;background:#1c3556;color:white;text-decoration:none;font-weight:700">Try again</a>
  </main>
</body>
</html>
